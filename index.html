<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#e91e63">

    <title>Happy Birthday Shahnash Ayisha ❤️</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #fff0f5,
                #ffe4ec,
                #ffffff
            );
            color: #5a2942;
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
        }

        img,
        video {
            max-width: 100%;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            min-height: 100svh;
            width: 100%;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            width: 100%;
            max-width: 1000px;

            font-size: clamp(
                32px,
                6vw,
                70px
            );

            line-height: 1.2;

            margin-bottom: 20px;

            color: #c2185b;

            animation: titleGlow 2s infinite alternate;
        }

        .hero p {
            font-size: clamp(
                16px,
                2vw,
                22px
            );

            margin-bottom: 30px;
        }


        /* =====================================================
           HERO IMAGE
        ===================================================== */

        .hero-image {
            width: clamp(
                210px,
                28vw,
                320px
            );

            height: clamp(
                210px,
                28vw,
                320px
            );

            object-fit: cover;

            border-radius: 50%;

            border: 8px solid white;

            box-shadow:
                0 0 20px rgba(194, 24, 91, 0.35),
                0 0 50px rgba(194, 24, 91, 0.2);

            animation:
                floatingPhoto 4s ease-in-out infinite,
                photoZoom 5s ease-in-out infinite alternate;
        }


        @keyframes floatingPhoto {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }


        @keyframes photoZoom {

            0% {
                box-shadow:
                    0 0 20px rgba(194, 24, 91, 0.3),
                    0 0 40px rgba(194, 24, 91, 0.15);
            }

            100% {
                box-shadow:
                    0 0 35px rgba(194, 24, 91, 0.6),
                    0 0 70px rgba(194, 24, 91, 0.3);
            }
        }


        @keyframes titleGlow {

            from {
                text-shadow:
                    0 0 5px rgba(194, 24, 91, 0.2);
            }

            to {
                text-shadow:
                    0 0 25px rgba(194, 24, 91, 0.6);
            }
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .btn {
            display: inline-flex;

            justify-content: center;
            align-items: center;

            min-height: 50px;

            padding: 14px 28px;

            margin: 8px;

            border: none;

            border-radius: 30px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;

            transition: 0.3s;

            -webkit-tap-highlight-color: transparent;
        }


        .yes {
            background: #e91e63;

            color: white;

            box-shadow:
                0 8px 20px rgba(
                    233,
                    30,
                    99,
                    0.3
                );
        }


        .yes:hover {
            transform: scale(1.08);

            box-shadow:
                0 12px 30px rgba(
                    233,
                    30,
                    99,
                    0.5
                );
        }


        .no {
            background: #777;

            color: white;

            position: relative;
        }


        .music {
            background: #9c27b0;

            color: white;

            box-shadow:
                0 8px 20px rgba(
                    156,
                    39,
                    176,
                    0.3
                );
        }


        .music:hover {
            transform: scale(1.06);
        }


        /* =====================================================
           NO BUTTON SHAKE
        ===================================================== */

        .no-shake {
            animation: noShake 0.5s;
        }


        @keyframes noShake {

            0% {
                transform:
                    translateX(0)
                    rotate(0);
            }

            20% {
                transform:
                    translateX(-15px)
                    rotate(-8deg);
            }

            40% {
                transform:
                    translateX(15px)
                    rotate(8deg);
            }

            60% {
                transform:
                    translateX(-12px)
                    rotate(-6deg);
            }

            80% {
                transform:
                    translateX(12px)
                    rotate(6deg);
            }

            100% {
                transform:
                    translateX(0)
                    rotate(0);
            }
        }


        /* =====================================================
           SECTIONS
        ===================================================== */

        section {
            width: 100%;

            padding:
                clamp(50px, 8vw, 90px)
                clamp(15px, 4vw, 40px);

            text-align: center;
        }


        section h2 {
            font-size: clamp(
                28px,
                4vw,
                45px
            );

            line-height: 1.3;

            color: #c2185b;

            margin-bottom: 30px;
        }


        /* =====================================================
           GALLERY
        ===================================================== */

        .gallery {
            width: 100%;

            max-width: 1200px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0, 1fr)
                );

            gap: clamp(
                15px,
                3vw,
                30px
            );
        }


        .gallery img {
            width: 100%;

            height: clamp(
                250px,
                30vw,
                380px
            );

            object-fit: cover;

            border-radius: 20px;

            border: 6px solid white;

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.15);

            animation:
                galleryFloat 4s ease-in-out infinite,
                galleryZoom 5s ease-in-out infinite alternate;

            transition: 0.4s;
        }


        .gallery img:nth-child(2) {
            animation-delay: 0.7s;
        }


        .gallery img:nth-child(3) {
            animation-delay: 1.4s;
        }


        .gallery img:hover {
            transform: scale(1.05);
        }


        @keyframes galleryFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }


        @keyframes galleryZoom {

            0% {
                box-shadow:
                    0 10px 25px
                    rgba(0, 0, 0, 0.15);
            }

            100% {
                box-shadow:
                    0 15px 40px
                    rgba(194, 24, 91, 0.3);
            }
        }


        /* =====================================================
           VIDEO SECTION
        ===================================================== */

        .video-section {
            width: 100%;

            max-width: 1100px;

            margin: auto;
        }


        .video-box {
            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding: 10px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #ffe4ec,
                    #ffffff
                );

            border-radius: 25px;

            box-shadow:
                0 15px 40px
                rgba(194, 24, 91, 0.2),

                0 0 30px
                rgba(194, 24, 91, 0.12);

            animation:
                videoGlow
                3s ease-in-out
                infinite alternate;
        }


        .birthday-video {
            width: 100%;

            height: auto;

            max-height: 75vh;

            display: block;

            border-radius: 18px;

            background: #000;

            object-fit: contain;
        }


        @keyframes videoGlow {

            from {
                box-shadow:
                    0 15px 40px
                    rgba(194, 24, 91, 0.15);
            }

            to {
                box-shadow:
                    0 20px 55px
                    rgba(194, 24, 91, 0.35);
            }
        }


        .video-caption {
            margin-top: 20px;

            font-size:
                clamp(
                    16px,
                    2vw,
                    20px
                );

            line-height: 1.6;
        }


        /* =====================================================
           PROPOSAL
        ===================================================== */

        .proposal {
            min-height: 70vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;
        }


        .proposal h2 {
            width: 100%;

            max-width: 900px;

            font-size:
                clamp(
                    28px,
                    5vw,
                    52px
                );
        }


        .proposal-text {
            width: 100%;

            max-width: 700px;

            font-size:
                clamp(
                    17px,
                    2vw,
                    23px
                );

            line-height: 1.6;

            margin-bottom: 25px;
        }


        /* =====================================================
           HEART EFFECT
        ===================================================== */

        .heart {
            position: fixed;

            pointer-events: none;

            font-size: 25px;

            animation:
                heartFall
                4s linear forwards;

            z-index: 9999;

            left: 0;

            top: 0;
        }


        @keyframes heartFall {

            0% {
                transform:
                    translateY(-20px)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(100vh)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* =====================================================
           NO MESSAGE
        ===================================================== */

        #noMessage {
            width: 100%;

            max-width: 600px;

            margin-top: 20px;

            font-size:
                clamp(
                    17px,
                    2vw,
                    21px
                );

            font-weight: bold;

            color: #e91e63;

            min-height: 30px;

            padding: 0 10px;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            width: 100%;

            padding: 30px 20px;

            text-align: center;

            font-size: 16px;

            color: #8b4965;

            line-height: 1.6;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            .gallery {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );
            }


            .gallery img {
                height: 330px;
            }


            .video-box {
                max-width: 750px;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .hero {
                min-height: 100svh;

                padding:
                    35px 15px;
            }


            .hero h1 {
                font-size: 35px;

                line-height: 1.25;

                margin-bottom: 15px;
            }


            .hero p {
                font-size: 17px;

                margin-bottom: 25px;
            }


            .hero-image {
                width: 230px;

                height: 230px;

                border-width: 6px;
            }


            .btn {
                width: auto;

                min-width: 150px;

                font-size: 16px;

                padding:
                    13px 20px;
            }


            section {
                padding:
                    55px 15px;
            }


            section h2 {
                font-size: 30px;

                margin-bottom: 25px;
            }


            .gallery {
                grid-template-columns: 1fr;

                max-width: 420px;

                gap: 25px;
            }


            .gallery img {
                width: 100%;

                height:
                    min(
                        400px,
                        105vw
                    );
            }


            .video-section {
                width: 100%;
            }


            .video-box {
                padding: 5px;

                border-radius: 18px;
            }


            .birthday-video {
                width: 100%;

                max-height: 65vh;

                border-radius: 13px;
            }


            .video-caption {
                font-size: 16px;

                margin-top: 15px;
            }


            .proposal {
                min-height: 65vh;

                padding-left: 12px;

                padding-right: 12px;
            }


            .proposal h2 {
                font-size: 30px;

                line-height: 1.35;
            }


            .proposal-text {
                font-size: 17px;

                margin-bottom: 15px;
            }


            footer {
                font-size: 14px;

                padding:
                    25px 15px;
            }
        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 380px) {

            .hero h1 {
                font-size: 30px;
            }


            .hero-image {
                width: 200px;

                height: 200px;
            }


            .btn {
                min-width: 135px;

                font-size: 15px;
            }


            .gallery img {
                height: 330px;
            }


            .proposal h2 {
                font-size: 27px;
            }
        }


        /* =====================================================
           LANDSCAPE MOBILE
        ===================================================== */

        @media
        (max-height: 500px)
        and
        (orientation: landscape) {

            .hero {
                min-height: auto;

                padding:
                    40px 20px;
            }


            .hero-image {
                width: 180px;

                height: 180px;
            }


            .hero h1 {
                font-size: 30px;
            }


            .gallery img {
                height: 250px;
            }
        }


        /* =====================================================
           REDUCE MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                scroll-behavior: auto !important;

                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         HERO
    ===================================================== -->

    <section class="hero">

        <h1>
            Happy Birthday
            Shahnash Ayisha ❤️
        </h1>

        <p>
            To the most beautiful person in my life 💕
        </p>


        <img
            src="ASSETS/memory-2.jpg"
            alt="Shahnash Ayisha"
            class="hero-image"
        >


        <div style="margin-top:25px;">

            <button
                class="btn music"
                onclick="toggleVideo()"
                id="musicButton"
            >
                🎵 Play Birthday Video
            </button>

        </div>

    </section>



    <!-- =====================================================
         MEMORY GALLERY
    ===================================================== -->

    <section>

        <h2>
            Our Beautiful Memories ❤️
        </h2>


        <div class="gallery">

            <img
                src="ASSETS/memory-1.jpg"
                alt="Our Memory 1"
                loading="lazy"
            >


            <img
                src="ASSETS/memory-2.jpg"
                alt="Our Memory 2"
                loading="lazy"
            >


            <img
                src="ASSETS/memory-3.jpg"
                alt="Our Memory 3"
                loading="lazy"
            >

        </div>

    </section>



    <!-- =====================================================
         VIDEO
    ===================================================== -->

            </h2>


            <div class="video-box">

                <video
                    id="birthdayVideo"
                    class="birthday-video"
                    controls

                    preload="metadata"
                >
